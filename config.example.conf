# ============================================================================
#  wp-autoinstall — файл параметров
#
#  Скопируйте и отредактируйте:
#      cp config.example.conf my-site.conf
#      nano my-site.conf
#      sudo ./install.sh -c my-site.conf -y
#
#  Формат: КЛЮЧ=значение, по одному в строке. Строки с # — комментарии.
#  Любой параметр можно не указывать — скрипт спросит его при запуске.
# ============================================================================

# ---------- сайт ----------
SITE_DOMAIN=example.com          # домен или IP-адрес сервера
SITE_TITLE="Мой сайт"              # название сайта (заголовок WordPress)
WP_LOCALE=ru_RU                  # язык: ru_RU, en_US, uk, kk, de_DE ...
# WP_PATH=/var/www/example.com   # каталог сайта (по умолчанию /var/www/ДОМЕН)

# ---------- администратор WordPress ----------
WP_ADMIN_USER=admin
WP_ADMIN_PASS=                   # пусто = сгенерировать надёжный пароль
WP_EMAIL=admin@example.com

# ---------- база данных ----------
DB_NAME=wp_site
DB_USER=wp_user
DB_PASS=                         # пусто = сгенерировать
TABLE_PREFIX=wp_
DB_ENGINE=auto                   # mariadb | mysql | auto
# DB_ROOT_PASS=                  # пароль root СУБД, если вход по паролю

# ---------- окружение ----------
WEB_SERVER=nginx                 # nginx | apache
PHP_VERSION=auto                 # auto | 8.4 | 8.3 | 8.2 | 8.1 | 7.4

# ---------- параметры PHP ----------
UPLOAD_MAX=128M                  # 8M 16M 32M 64M 128M 256M 512M 1G
MAX_INPUT_VARS=3000              # 1000 3000 5000 10000 20000
PHP_MEMORY_LIMIT=256M            # 128M 256M 512M 768M 1G
MAX_EXEC_TIME=300                # 30 60 120 300 600

# ---------- дополнительные компоненты ----------
INSTALL_PMA=no                   # yes | no — phpMyAdmin по адресу /phpmyadmin/
INSTALL_SSL=no                   # yes | no — сертификат Let's Encrypt (нужен домен)
INSTALL_FIREWALL=no              # yes | no — UFW + fail2ban
