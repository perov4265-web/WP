# ============================================================================
#  wp-autoinstall — файл параметров
#
#  Файл можно не писать руками — скрипт умеет создавать и править его сам:
#      sudo ./install.sh --configure my-site.conf
#  Существующие значения подставятся как ответы по умолчанию.
#
#  Или скопируйте образец и отредактируйте:
#      cp config.example.conf my-site.conf
#      nano my-site.conf
#      sudo ./install.sh -c my-site.conf -y
#
#  Формат: КЛЮЧ=значение, по одному в строке. Строки с # — комментарии.
#  Комментарий в конце строки отделяйте пробелом. Значения с пробелами
#  или начинающиеся с # берите в кавычки: WP_ADMIN_PASS="#Str0ng Pass"
#  Любой параметр можно не указывать — скрипт спросит его при запуске.
# ============================================================================

# ---------- сайт ----------
SITE_DOMAIN=example.com          # домен или IP-адрес сервера
SITE_TITLE="Мой сайт"              # название сайта (заголовок WordPress)
WP_LOCALE=ru_RU                  # язык: ru_RU, en_US, uk, kk, de_DE ...
# WP_PATH=/var/www/example.com   # каталог сайта (по умолчанию /var/www/ДОМЕН)

# ---------- администратор WordPress ----------
WP_ADMIN_USER=admin
WP_ADMIN_PASS=                   # пусто = сгенерировать надёжный пароль
WP_EMAIL=admin@example.com

# ---------- база данных ----------
DB_NAME=wp_site
DB_USER=wp_user
DB_PASS=                         # пусто = сгенерировать
TABLE_PREFIX=wp_
DB_ENGINE=auto                   # mariadb | mysql | auto
# DB_ROOT_PASS=                  # пароль root СУБД, если вход по паролю

# ---------- окружение ----------
WEB_SERVER=nginx                 # nginx | apache
PHP_VERSION=auto                 # auto | 8.4 | 8.3 | 8.2 | 8.1 | 7.4

# ---------- параметры PHP ----------
UPLOAD_MAX=128M                  # 8M 16M 32M 64M 128M 256M 512M 1G
MAX_INPUT_VARS=3000              # 1000 3000 5000 10000 20000
PHP_MEMORY_LIMIT=256M            # 128M 256M 512M 768M 1G
MAX_EXEC_TIME=300                # 30 60 120 300 600

# ---------- дополнительные компоненты ----------
INSTALL_PMA=no                   # yes | no — phpMyAdmin по адресу /phpmyadmin/
INSTALL_SSL=no                   # yes | no — сертификат Let's Encrypt (нужен домен)
INSTALL_FIREWALL=no              # yes | no — UFW + fail2ban
INSTALL_CACHE=no                 # yes | no — кэш готовых страниц в nginx
SETUP_SWAP=yes                   # yes | no — файл подкачки, если его ещё нет
SWAP_SIZE=2G
CREATE_ROBOTS=yes                # robots.txt с запретом индексации поиска
WP_DEBUG_MODE=no                 # yes — включить wp-content/debug.log

# ---------- устойчивость под нагрузкой ----------
# Пустые значения считаются автоматически от объёма памяти сервера.
# FPM_MAX_CHILDREN=              # воркеров PHP-FPM
# FPM_TIMEOUT=                   # секунд до обрыва зависшего запроса PHP
DB_MAX_STATEMENT_TIME=30         # секунд до обрыва тяжёлого SQL-запроса
# DB_BUFFER_POOL_MB=             # размер innodb_buffer_pool, по умолчанию 25% RAM
SEARCH_RATE=20r/m                # лимит на запросы поиска, синтаксис nginx
# SSH_ALLOW_FROM=203.0.113.5     # открыть SSH только с этого адреса
# NGINX_EXTRA_CONF=extras/legacy-urls.conf.example
